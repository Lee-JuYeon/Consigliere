# Ledger Configuration

[index]
paths = ["docs/**/*.md", "CLAUDE.md", "**/*.md"]
exclude = ["node_modules/**", ".ledger/**", ".git/**", "sdk/**"]
watch = false

[search]
default_top_k = 5
min_score = 0.3

[project]
name = "ledger"

[embedding]
enabled = false
model = "nomic-embed-text"
endpoint = "http://localhost:11434"
dimensions = 768

# [plugins]
